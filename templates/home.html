{{define "content"}}

<div class="container py-4">
  <h1 class="text-center mb-4">NYC Capital Projects AI Agent</h1>

  <div id="chat-container">
    <div id="flash-message"></div>
  </div>

  <div id="input-area">
    <textarea
      id="question"
      class="form-control"
      rows="2"
      placeholder="Type your question..."
    ></textarea>

    <button id="submit" class="btn btn-primary">Send</button>
  </div>

  <div class="text-center text-muted">
    ⚡ Note: Since the AI agent runs locally, responses may take a few seconds.
  </div>
</div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const questionInput = document.getElementById('question');
  const submitButton = document.getElementById('submit');
  const flashMessage = document.getElementById('flash-message');

  let thinkingContent = null;
  let waitingTimer = null;

  function showFlash(msg, duration = 3000, type = 'info') {
    flashMessage.innerText = msg;
    flashMessage.className = type === 'error' ? 'flash-error' : 'flash-info';
    flashMessage.style.display = 'block';

    setTimeout(() => {
      flashMessage.style.display = 'none';
    }, duration);
  }

  function addMessage(text, type, timestamp = null) {
    const row = document.createElement('div');
    row.className = `chat-row ${type === 'user-message' ? 'user' : ''}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${type === 'user-message' ? 'user-avatar' : 'ai-avatar'}`;
    avatar.innerHTML = type === 'user-message'
      ? '<i class="fas fa-user"></i>'
      : '<i class="fas fa-robot"></i>';

    const msg = document.createElement('div');
    msg.className = `message ${type}`;

    const content = document.createElement('div');
    content.className = 'content';
    content.innerHTML = text;

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.innerText = timestamp || new Date().toLocaleTimeString();

    msg.appendChild(content);
    msg.appendChild(ts);

    if (type === 'user-message') {
      row.appendChild(msg);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(msg);
    }

    chatContainer.appendChild(row);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    return content;
  }

  function typeAnswer(contentElement, answer) {
    contentElement.innerHTML = '';

    let i = 0;

    const interval = setInterval(() => {
      contentElement.innerText = answer.slice(0, i);
      i++;

      if (i > answer.length) {
        clearInterval(interval);
      }
    }, 20);
  }

  function enableInput() {
    questionInput.disabled = false;
    submitButton.disabled = false;
    questionInput.focus();
  }

  function disableInput() {
    questionInput.disabled = true;
    submitButton.disabled = true;
  }

  function handleWebSocketMessage(event) {
    const response = event.detail;

    if (waitingTimer) {
      clearTimeout(waitingTimer);
      waitingTimer = null;
    }

    if (response.action === 'connected') {
      showFlash(response.message || 'Connected to server.', 2000, 'info');
      return;
    }

    if (response.action === 'upload_status') {
      return;
    }

    if (response.action === 'error') {
      showFlash(response.message || 'An error occurred.', 3000, 'error');

      if (thinkingContent) {
        thinkingContent.innerText = 'Error encountered.';
      }

      thinkingContent = null;
      enableInput();
      return;
    }

    if (response.action !== 'answer') {
      return;
    }

    const answer = response.message || 'No answer returned.';

    if (thinkingContent) {
      typeAnswer(thinkingContent, answer);
      thinkingContent = null;
    } else {
      addMessage(answer, 'ai-message');
    }

    enableInput();
  }

  function sendQuestion() {
    const question = questionInput.value.trim();

    if (!question) {
      return;
    }

    disableInput();

    addMessage(question, 'user-message');
    questionInput.value = '';

    thinkingContent = addMessage(
      'AI is typing... <span class="spinner-border spinner-border-sm"></span>',
      'ai-message'
    );

    waitingTimer = setTimeout(() => {
      showFlash('Still thinking... thanks for your patience!', 4000, 'info');
    }, 5000);

    const sent = sendAppSocketMessage({
      action: 'ask',
      message: question
    });

    if (!sent) {
      if (waitingTimer) {
        clearTimeout(waitingTimer);
        waitingTimer = null;
      }

      if (thinkingContent) {
        thinkingContent.innerText = 'Connection error.';
      }

      thinkingContent = null;
      enableInput();
    }
  }

  submitButton.onclick = sendQuestion;

  questionInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();

      if (!questionInput.disabled) {
        sendQuestion();
      }
    }
  });

  window.addEventListener('app:websocket-message', handleWebSocketMessage);

  document.addEventListener('DOMContentLoaded', function () {
    addMessage(
      'Hi! I’m your NYC Capital Projects AI Agent 🤖. Ask me about any NYC capital projects!',
      'ai-message'
    );
  });
</script>

{{end}}

{{template "base" .}}
