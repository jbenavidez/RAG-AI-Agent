{{define "base"}}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{block "title" .}}NYC Capital Projects AI Agent{{end}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <link href="/static/css/styles.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">RAG-Agent</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar"
                aria-controls="navbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a
                            class="nav-link dropdown-toggle"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                        >
                            Docs
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="/docs">All Docs</a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/upload">Upload</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <div id="global-flash-message" style="display: none;"></div>
    </div>

    <main>
        {{template "content" .}}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.appSocket = null;

        function showGlobalFlash(message, duration = 3000, type = 'info') {
            const flashMessage = document.getElementById('global-flash-message');

            if (!flashMessage) {
                return;
            }

            flashMessage.innerText = message;
            flashMessage.className = type === 'error'
                ? 'alert alert-danger alert-dismissible fade show'
                : 'alert alert-info alert-dismissible fade show';

            flashMessage.style.display = 'block';

            setTimeout(() => {
                flashMessage.style.display = 'none';
            }, duration);
        }

        function sendAppSocketMessage(payload) {
            if (!window.appSocket || window.appSocket.readyState !== WebSocket.OPEN) {
                showGlobalFlash('WebSocket is not connected yet. Please refresh the page.', 3000, 'error');
                return false;
            }

            window.appSocket.send(JSON.stringify(payload));
            return true;
        }

        function connectAppWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';

            window.appSocket = new WebSocket(`${protocol}://${window.location.host}/ws`);

            window.appSocket.onopen = function () {
                console.log('WebSocket connected');
            };

            window.appSocket.onmessage = function (event) {
                let response;

                try {
                    response = JSON.parse(event.data);
                } catch (err) {
                    showGlobalFlash('Invalid response from server.', 3000, 'error');
                    return;
                }

                window.dispatchEvent(new CustomEvent('app:websocket-message', {
                    detail: response
                }));

                if (response.action === 'upload_status') {
                    showGlobalFlash(response.message || 'Upload status updated.', 5000, 'info');
                    return;
                }

                if (response.action === 'error') {
                    showGlobalFlash(response.message || 'An error occurred.', 3000, 'error');
                    return;
                }
            };

            window.appSocket.onerror = function () {
                showGlobalFlash('WebSocket error. Please refresh the page.', 3000, 'error');
            };

            window.appSocket.onclose = function () {
                console.log('WebSocket connection closed');
            };
        }

        document.addEventListener('DOMContentLoaded', connectAppWebSocket);
    </script>
</body>
</html>
{{end}}
